<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід / Реєстрація — TOP MODS</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            background: #090d16 url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            font-family: 'Inter', sans-serif;
            color: #fff;
        }
        .auth-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(9, 13, 22, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1;
        }
        .auth-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 440px;
            background: #0d111aff;
            border: 1px solid #1f293d;
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .auth-logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        .auth-logo i {
            font-size: 2.5rem;
            color: #a855f7;
            margin-bottom: 0.5rem;
        }
        .auth-logo h2 {
            font-size: 1.5rem;
            font-weight: 800;
            margin: 0;
        }
        .auth-logo p {
            color: #94a3b8;
            font-size: 0.8rem;
            margin-top: 4px;
        }
        .auth-tabs {
            display: flex;
            background: #131b2e;
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 1.5rem;
        }
        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #94a3b8;
            cursor: pointer;
            border-radius: 8px;
            border: none;
            background: transparent;
            transition: 0.2s;
        }
        .auth-tab.active {
            background: #7c3aed;
            color: #fff;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.4);
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-label {
            display: block;
            font-size: 0.8rem;
            color: #cbd5e1;
            margin-bottom: 6px;
            font-weight: 500;
        }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-wrapper i {
            position: absolute;
            left: 14px;
            color: #64748b;
            font-size: 0.9rem;
        }
        .input-wrapper input {
            width: 100%;
            background: #131b2e;
            border: 1px solid #1f293d;
            border-radius: 8px;
            padding: 11px 14px 11px 40px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }
        .input-wrapper input:focus {
            border-color: #a855f7;
        }
        .auth-btn {
            width: 100%;
            background: linear-gradient(90deg, #7c3aed, #6366f1);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        .back-home {
            text-align: center;
            margin-top: 1.5rem;
        }
        .back-home a {
            color: #94a3b8;
            font-size: 0.8rem;
            text-decoration: none;
        }
        .back-home a:hover {
            color: #a855f7;
        }
    </style>
</head>
<body>

    <div class="auth-overlay"></div>

    <div class="auth-container">
        <div class="auth-logo">
            <i class="fa-solid fa-crown"></i>
            <h2>TOP MODS</h2>
            <p>Моди, які роблять гру кращою</p>
        </div>

        <div class="auth-tabs">
            <button class="auth-tab active" type="button" onclick="setMode('login')">Вхід</button>
            <button class="auth-tab" type="button" onclick="setMode('register')">Реєстрація</button>
        </div>

        <form id="authForm" onsubmit="handleAuth(event)">
            <div class="form-group" id="nameGroup" style="display: none;">
                <label class="form-label">Нікнейм</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-user"></i>
                    <input type="text" id="usernameInput" placeholder="Ваш нікнейм">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Email або нікнейм</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="text" id="emailInput" placeholder="Введіть email або нікнейм" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Пароль</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="passwordInput" placeholder="Введіть пароль" required>
                </div>
            </div>

            <button type="submit" class="auth-btn" id="submitBtn">Увійти →</button>
        </form>

        <div class="back-home">
            <a href="index.html"><i class="fa-solid fa-house"></i> На головну</a>
        </div>
    </div>

    <script>
        let isLogin = true;

        function setMode(mode) {
            isLogin = (mode === 'login');
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            document.getElementById('nameGroup').style.display = isLogin ? 'none' : 'block';
            document.getElementById('submitBtn').innerText = isLogin ? 'Увійти →' : 'Зареєструватися →';
        }

        function handleAuth(event) {
            event.preventDefault();
            let name = isLogin ? (document.getElementById('emailInput').value.split('@')[0]) : document.getElementById('usernameInput').value;
            if(!name) name = "Солтис Вадим";
            
            // Зберігаємо стан входу в пам'яті браузера
            localStorage.setItem('topModsUser', name);
            window.location.href = 'profile.html';
        }
    </script>
</body>
</html>
